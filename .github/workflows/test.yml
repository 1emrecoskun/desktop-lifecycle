name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        exclude:
          # Keep the matrix affordable: full versions on Linux, the extremes
          # elsewhere. The code is pure Python, so OS coverage matters more
          # than running every version on every runner.
          - os: windows-latest
            python-version: "3.10"
          - os: windows-latest
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.10"
          - os: macos-latest
            python-version: "3.11"
          - os: macos-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Byte-compile the package and the tests
        run: python -m compileall -q desktop_lifecycle tests examples
      - name: Run the test suite
        run: python -m unittest discover -s tests -v

  package:
    name: Build and install the distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --disable-pip-version-check --quiet build
          python -m build
      - name: Verify the wheel is dependency-free and importable
        run: |
          python -m venv /tmp/dl-venv
          /tmp/dl-venv/bin/python -m pip install --disable-pip-version-check --quiet dist/*.whl
          /tmp/dl-venv/bin/python -c "import desktop_lifecycle; print(desktop_lifecycle.__version__)"
          /tmp/dl-venv/bin/desktop-lifecycle --json > /dev/null
          /tmp/dl-venv/bin/python -m pip check
      - name: Check the metadata
        run: |
          python -m pip install --disable-pip-version-check --quiet twine
          python -m twine check dist/*

  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No secrets, private paths or hardware identifiers
        run: |
          set -euo pipefail
          failed=0
          scan() {
            local label="$1" pattern="$2"
            # The workflow file itself contains these patterns, so it is the
            # only path excluded from the scan.
            if grep -rInE -e "$pattern" . \
                --exclude-dir=.git \
                --exclude=.github/workflows/test.yml ; then
              echo "::error::$label found above"
              failed=1
            fi
          }
          scan "absolute home directory path" '/home/[A-Za-z0-9._-]+/'
          scan "private key block" '-----BEGIN [A-Z ]*PRIVATE KEY-----'
          scan "likely API token" '(sk-[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16})'
          scan "MAC address" '([0-9A-Fa-f]{2}:){5}[0-9A-Fa-f]{2}'
          junk=$(find . -path ./.git -prune -o \
            \( -name '.DS_Store' -o -name 'Thumbs.db' -o -name '*.swp' \
               -o -name '__pycache__' -o -name '*.pyc' \) -print)
          if [ -n "$junk" ]; then
            echo "::error::committed junk files: $junk"
            failed=1
          fi
          exit "$failed"
